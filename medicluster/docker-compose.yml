version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:5000

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PATIENT_PUBLIC_ORIGIN: ${PATIENT_PUBLIC_ORIGIN:-http://localhost:3000}
      ML_ENGINE_URL: http://ml-engine:8000
      PORT: 5000
    depends_on:
      - ml-engine

  ml-engine:
    build: ./ml-engine
    ports:
      - "8000:8000"
