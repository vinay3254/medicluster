name: Patient Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'medicluster/patient-android/**'
      - '.github/workflows/patient-android.yml'

permissions:
  contents: write

concurrency:
  group: patient-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PATIENT_APP_ORIGIN: https://medicluster-frontend.onrender.com
      PATIENT_VERSION_CODE: ${{ github.run_number }}
      PATIENT_VERSION_NAME: 1.0.${{ github.run_number }}
      PATIENT_KEYSTORE_PATH: ${{ github.workspace }}/../patient-release.jks
      PATIENT_KEYSTORE_PASSWORD: ${{ secrets.PATIENT_KEYSTORE_PASSWORD }}
      PATIENT_KEY_ALIAS: ${{ secrets.PATIENT_KEY_ALIAS }}
      PATIENT_KEY_PASSWORD: ${{ secrets.PATIENT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PATIENT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PATIENT_KEYSTORE_PATH"
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test and build signed APK
        working-directory: medicluster/patient-android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs medicluster/patient-android/app/build/outputs/apk/release/app-release.apk'
      - name: Stage website download
        run: |
          mkdir -p medicluster/frontend/public/downloads
          cp medicluster/patient-android/app/build/outputs/apk/release/app-release.apk medicluster/frontend/public/downloads/medicluster-patient.apk
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('medicluster/frontend/public/downloads/medicluster-patient.apk')
          metadata = {'versionName': os.environ['PATIENT_VERSION_NAME'], 'versionCode': int(os.environ['PATIENT_VERSION_CODE']), 'sizeBytes': apk.stat().st_size, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}
          apk.with_name('patient-app.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Publish installer to website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medicluster/frontend/public/downloads/medicluster-patient.apk medicluster/frontend/public/downloads/patient-app.json
          git commit -m "release: publish patient Android APK ${PATIENT_VERSION_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove signing key
        if: always()
        run: rm -f "$PATIENT_KEYSTORE_PATH"
